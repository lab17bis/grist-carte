<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://docs.getgrist.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte</title>
  <link rel="stylesheet" href="vendor/dsfr/dsfr.min.css">
  <link rel="stylesheet" href="vendor/dsfr/utility/icons/icons.min.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="commun/page.css?v=2">
  <link rel="stylesheet" href="css/app.css?v=2">

  <link rel="stylesheet" href="commun/grist-public.css?v=1">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <a class="fr-link gc-evitement" href="#gc-panneau">Aller à la liste des points</a>
  <div id="entete"></div>
  <div id="gc-demo" class="fr-notice fr-notice--info" hidden>
    <div class="gc-marge">
      <div class="fr-notice__body">
        <p class="fr-notice__title">Mode démonstration : données fictives, rien n'est enregistré.</p>
      </div>
    </div>
  </div>
  <div id="gc-coque"></div>
  <main class="gc-cadre">
    <div class="gc-cote">
      <div id="gc-panneau" class="gc-panneau" tabindex="-1"><p>Chargement…</p></div>
      <div class="gc-pied">
        <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-settings-5-line fr-btn--icon-left" id="gc-reglages" data-ecriture>Réglages</button>
        <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-refresh-line fr-btn--icon-left" id="gc-actualiser">Actualiser</button>
        <label class="fr-label gc-theme-label" for="gc-theme">Thème</label>
        <select class="fr-select fr-select--sm gc-theme" id="gc-theme" title="Thème">
          <option value="auto">Auto</option>
          <option value="light">Clair</option>
          <option value="dark">Sombre</option>
        </select>
      </div>
    </div>
    <div id="gc-carte" class="gc-carte" role="region" aria-label="Carte"></div>
  </main>
  <div id="pied"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet/leaflet.markercluster.js"></script>
  <script src="commun/page-dsfr.js?v=3"></script>
  <script src="commun/page-editeur.js?v=1"></script>
  <script src="commun/configuration.js?v=9"></script>
  <script src="commun/grist-public.js?v=1"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
